name: pages

on:
  push:
    branches: [main]
    # Only what the built site is made of. README and assets pushes were each
    # triggering a full rebuild + deploy of byte-identical content - three of
    # them piled onto a slow Pages queue the day this line was added.
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "pipeline/check_site_links.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One-time setup: Settings > Pages > Source = "GitHub Actions", then re-run.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to the versions the link-gate below is verified against (same lesson as
      # mcp<2 in validate.yml: an unpinned toolchain fails on its own schedule).
      - run: python -m pip install "mkdocs-material==9.7.7" "mkdocs-roamlinks-plugin==0.3.2"
      - name: Stage site sources (the wiki, untouched, plus an index page)
        run: |
          mkdir -p site-src
          cp -R wiki/. site-src/
          rm -rf site-src/.obsidian
          cp "wiki/00 - START HERE.md" site-src/index.md
      - run: mkdocs build
      # Blocking: the wiki gates check the markdown sources, which can be perfectly valid
      # while the rendered site 404s (a link the roamlinks plugin could not resolve, a
      # path that leaves the published tree). Deploying a site with dead links is worse
      # than not deploying, because the gates stay green and nobody looks.
      - name: Check the built site for dead links
        run: python pipeline/check_site_links.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages hard-caps its poll at 10 minutes: a `timeout:` input above the
      # cap is silently clamped (Math.min in the action's source), so "wait longer"
      # is not an available fix. On 2026-08-06 five consecutive deploys of
      # byte-identical content died on "Timeout reached, aborting!" while the build
      # stayed green and githubstatus said "operational". What CAN be done is try
      # twice: a second 10-minute window catches the backend hiccup the first one
      # sat through.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
