insurer:
  slug: maaf
  name: "MAAF — a single brand covering four regulated carriers: MAAF Assurances SA (société anonyme, Code des assurances, RCS Niort 542 073 580), MAAF Assurances (société d'assurance mutuelle à cotisations variables, Code des assurances, RCS Niort 781 423 280), MAAF Vie (société anonyme, Code des assurances, RCS Niort 337 804 819) and MAAF Santé (mutuelle du livre II du Code de la mutualité, SIREN 331 542 142). Group Covéa."
  website: "https://www.maaf.fr/"
  segment: particuliers
  notes: |
    MAAF is a first-party carrier, but the brand spans TWO French legal codes and the documents say so explicitly. IARD, prévoyance and auto risks are carried by MAAF Assurances SA, a société anonyme 'entreprise régie par le Code des assurances - RCS NIORT 542 073 580'. Health risks are carried by MAAF Santé, 'Mutuelle soumise aux dispositions du livre II du Code de la Mutualité - SIREN N° 331 542 142'. The single clearest statement is in MAAF_Convention_Retraites.pdf, which is a contract between two of them: 'Passée entre : MAAF Assurances, Société d'assurance mutuelle à cotisations variables, régie par le Code des Assurances, RCS NIORT 781 423 280, dénommée ci-après la contractante, et MAAF Santé, Mutuelle soumise aux dispositions du Livre II du Code de la Mutualité, SIREN 331 542 142, dénommée ci-après l'assureur ... à l'exception des garanties d'assistance santé à domicile assurées par MAAF Assurances SA' — and then 'La présente convention d'assurance est régie par le Code de la Mutualité.' The same split appears compressed into one sentence in the santé CGs: 'Les Garanties du présent Contrat sont assurées par MAAF Santé, régie par le Code de la Mutualité, à l'exception des garanties d'assistance santé à domicile qui sont assurées par MAAF Assurances SA', and in the santé footers: 'Garanties santé assurées par MAAF santé, garanties d'assistance assurées par MAAF Assurances SA, contrat distribué par MAAF Assurances SA'. It is even visible inside the IPID set: 25 of the 26 IPIDs print 'MAAF Assurances SA / France - RCS Niort 542 073 580' on the carrier line, and SAN25001 (Vivazen) prints 'MAAF Santé / Mutuelle soumise aux dispositions du livre II du code de la mutualité - SIREN 331 542 142'. A THIRD MAAF entity carries risk too and is easy to miss: MAAF Assurances, the société d'assurance mutuelle (RCS Niort 781 423 280, also under the Code des assurances, distinct from MAAF Assurances SA). It appears in most IARD conditions générales as the carrier of the ancillary/assistance guarantees — 'Ces prestations sont assurées par MAAF Assurances (Société d'assurance mutuelle à cotisations variables, entreprise régie par le code des assurances - RCS NIORT 781 423 280)' — and as the SOUSCRIPTEUR of the group health contracts. MAAF Vie (SA, Code des assurances, RCS Niort 337 804 819) carries the épargne/retraite contracts. Two documents are NOT carried by MAAF at all: both Défense Juridique conditions générales name 'ASSISTANCE PROTECTION JURIDIQUE, Société anonyme d'assurance ... R.C.S Bobigny 334 656 386' as l'assureur, and the auto CG says the product 'constitue un contrat distinct dont Assistance Protection Juridique est l'assureur'. Newer MAAF CGs name the same entity under its current name, Covéa Protection Juridique (RCS Le Mans 442 935 227), as the assureur of the protection-juridique sections. Finally, one contract splits its carrier BY BRANCH: the emprunteur notice says the contract is souscrit by ANS Vie-Covéa 'auprès de : - MAAF Vie pour les risques de décès et de perte totale et irréversible d'autonomie (branche 20). - Et MAAF Assurances SA pour les risques arrêt de travail et perte d'emploi (branches 1, 2 et 16)'.

    NOT PUBLISHED: No conditions particulières and no conditions tarifaires are published anywhere on maaf.fr — those are issued per policyholder and live behind the espace client, which robots.txt disallows and which we did not touch. There is no single 'documents contractuels' library either: /fr/documents-information-assurances is an IPID index only (26 IPIDs plus exactly two santé PDFs), and the conditions générales are not linked from it. The 44 conditions générales in this result were assembled from three different surfaces — the sitemap (most of them), llms.txt (5 that appear nowhere else, including the auto CG) and one assurance-vie regulatory page. Coverage is uneven against MAAF's own product range. Missing public conditions générales include: the health gammes MÉDIKA, VITAMINE, VITAPRO and VITAMINE BANQUE POPULAIRE (named in the règlement mutualiste but with no CG of their own); the chasse and bateau/ALCYON products (IPIDs IRD11004 and IRD11001 exist, no CG); the cyclo and caravane/remorque/camion products (IPIDs AUT11019 and AUT11028 exist, no CG); scolaire (a tableau de garanties only); décennale / RC construction (a pedagogical guide only, no CG); the standalone Winalto Donatio and Homme Clé wordings beyond what is in the Epargne and Professionnels CGs; and animaux, cyber, voyage, agricole and obsèques, for which MAAF publishes nothing at all. The IPID set and the CG set do not pair up: 21 of the 26 IPIDs have a matching published conditions générales, 5 do not (cyclo AUT11019, caravane/remorque/camion AUT11028, bateau ALCYON IRD11001, chasse IRD11004, assurance accident PRE10003). In the other direction, of the 44 conditions générales 9 are sector intercalaires that never get their own IPID, leaving 35 standalone CGs against 26 IPIDs. Also not published contractually, and deliberately excluded from documents[]: 26 verified PDFs that are prevention leaflets, claim-handling how-tos (constat, expertise, checklists), commercial one-pagers (bonus décennal, bonus multipro), service guides, the UNOCAM glossary, avis d'échéance explainers, Covéa livres blancs, ESG and solvency (SFCR) reports, annual reports, press releases and baromètres. One structural gap we could not close: the DataDome block on HTML routes stopped the sitemap page crawl after 76 of 1,220 pages, so any contractual PDF that is linked only from a product page AND absent from both the sitemap and llms.txt would have been missed. The 76 pages that did succeed yielded only 20 PDF links, 15 of them already known, which suggests the residual risk is small but it is not zero.

    TRAP: DO NOT ENUMERATE THE IPID CODE SPACE. /fr/files/live/sites/maaf/files/TECH/Ipids/<CODE>.PDF answers HEAD cleanly with 200 vs 404, which makes an enumerator tempting; a predecessor agent started building one and it was discarded unused (its output is left under tmp/DISCARDED_enumeration_do_not_use/ and was not used here). The 26 IPIDs in this result are exactly the ones MAAF links from its own library page. Anything else in that code space is unlinked and out of scope.

    TRAP: A curl 403 on maaf.fr is not proof of a WAF: the same URL with the same browser UA returns 200 to Python urllib. But an HTML 403 after ~50 fast requests IS a real DataDome block, and it persists for the session. Distinguish the two before concluding a host is unreachable.

    TRAP: The static document path /fr/files/live/... is not behind DataDome. When HTML is blocked you can still fetch every PDF. Do the HTML first, slowly, then the PDFs.

    TRAP: https://www.maaf.fr/llms.txt is named in robots.txt and is a genuine discovery source, not just marketing: it has a 'Documents contractuels prioritaires' section that links 8 conditions générales by absolute URL. FIVE of those are in NO sitemap and are linked from no page we could read — the auto CG (18133), the moto CG (2001), the camping-car CG (6056), the Tranquillité Famille CG (1994) and the emprunteur notice (7313562). Without llms.txt you lose MAAF's single most important document, the auto conditions générales. Read llms.txt on every French insurer that declares one.

    TRAP: llms.txt is served with NO Content-Type header and cp1252/latin-1 bytes. body.decode('utf-8') raises UnicodeDecodeError; decode with cp1252.

    TRAP: PARSE <loc> ALLOWING WHITESPACE. Five sitemap URLs contain LITERAL SPACES in the path, un-encoded, e.g. '.../Professionnels/CG/2350 CG Gar HomCle 0124.pdf'. The obvious regex <loc>([^<\s]+)</loc> silently drops all five and you never learn they existed. Three of the five are in scope, including a 50-page conditions générales (Garanties Homme Clé) that is the only published CG behind two IPIDs. Use <loc>(.*?)</loc> and strip, then percent-encode before fetching. This cost a full rebuild here; do not repeat it.

    TRAP: Two sitemap URLs contain non-ASCII characters in the path (…propriétaire_non_occupant.pdf and …Chambre_des_Métiers_11033.pdf). urllib raises on these unless you percent-encode the path first (urlsplit -> quote(path) -> urlunsplit). Both are real 200s once encoded; a naive run silently loses two documents, one of them a 78-page conditions générales.

    TRAP: The number in a MAAF filename is the document's internal 'Réf.', not a date and not always the same number the document prints. MAAF_Notice_information_Assurance_credit_7313562.pdf prints 'Réf. 18151 - 07/25' inside.

    TRAP: Almost every MAAF document carries its own edition date, so edition_source is 'document' for 91 of 94 here. Conditions générales print 'Réf. NNNN - MM/YY' on the last page. IPIDs encode it in the first line's reference string: 'Réf. : MU0_IPIDHA_00-260315-...' means 2026-03. Tableaux de garanties print 'www.maaf.fr - MM/YYYY' in the footer. Santé annexes date themselves 'en vigueur au DD/MM/YYYY'. Statuts date themselves by the general meeting that adopted them.

    TRAP: The IPID header block is rigidly structured and worth parsing rather than guessing: line 1 'Réf. : <code>', line 2 'Document d'information sur le produit d'assurance', line 3 the insurance type, line 4 THE CARRIER, line 5 the legal-regime line, line 6 THE PRODUCT NAME. The product name is the one the site's anchor text usually disagrees with — 37 of 94 documents here have site_label_diverges = true.

    TRAP: The site's anchor text is consistently shorter and more commercial than the document's own name. Example: the library page says 'assurance camping-car, Ambulance, Véhicule de collection, Bazar forain' for AUT11023, whose own product line reads 'Camping-Car, Ambulance, Bazar forain, Véhicule de collection'. The document wins.

    TRAP: Only 40 of the 94 in-scope documents are reachable from an HTML page or llms.txt; the other 54 are listed as <loc> entries in https://www.maaf.fr/fr/sitemap.xml and are linked from no page we could read. The sitemap is the primary discovery surface here, not the site navigation.

    TRAP: The sitemap is stale: 70 of the 1,220 non-agency HTML URLs it lists return 404, and /fr/assurance-auto/documents-credit-auto returns 403/404 rather than a documents page.

    TRAP: The 'tableaux de garanties' footers refuse to name a single carrier: 'par MAAF Assurances SA et/ou MAAF Assurances AM et/ou MAAF Vie et/ou MAAF Santé et/ou Covéa Protection Juridique et/ou APGIS'. Note 'MAAF Assurances AM' is how those sheets abbreviate the société d'assurance mutuelle, and APGIS is a fourth-party institution de prévoyance. The carrier recorded for those rows is the carrier of the underlying contract, not a claim the sheet makes.

    TRAP: FIDELIA ASSISTANCE (RCS Nanterre 377 768 601) appears in nine santé documents but is NOT a carrier: 'MAAF Assurances SA a confié la gestion des garanties d'assistance à FIDELIA ASSISTANCE'. MAAF Assurances SA carries branch 18; FIDELIA only manages it. Do not record it as an assureur.

    TRAP: Four documents name MORE THAN ONE carrier for different parts of the same product, so a one-carrier-per-document model will mis-record them: the emprunteur notice splits MAAF Vie (branche 20) from MAAF Assurances SA (branches 1, 2, 16); '2350 CG Gar HomCle' bundles an « Assurance Perte de Revenus » assurée par MAAF Assurances SA with an « Assurance Décès » whose assureur is MAAF Vie; the santé CGs split MAAF Santé (health) from MAAF Assurances SA (assistance); and Tempo Habitation splits MAAF Assurances SA, MAAF Assurances (the SAM) and Covéa Protection Juridique across three sections.

    TRAP: No GMF or MMA entity appears as carrier in any maaf.fr document, so there is no overlap with the sibling agents' hosts. Covéa appears only as the group name and, via Covéa Protection Juridique, as the protection-juridique carrier. maaf.fr's own llms.txt states the boundary: 'MAAF, MMA et GMF sont des marques distinctes.'

    TRAP: MAAF_conditions_generales_..._vivazen_2542.pdf and ..._vivazen_pro_2541.pdf are PARALLEL VARIANTS, not two editions: both 51 pages, both edition 01/26, different réf. numbers and different body text (individual vs pro offer). Do not collapse them into one document with two dates.

    TRAP: MAAF_Statuts_1865.pdf (Habitation/Souscription/, 2015 general meeting) and Statuts_MAAF_de_Assurances.pdf (maaf_com/Status/, 2021 general meeting) ARE the same document in two genuine editions, published at two unrelated paths. Both are kept; neither is a byte-duplicate of the other.

    TRAP: The Règlement Mutualiste MAAF Santé (18638) is the Code-de-la-mutualité analogue of conditions générales and it covers six gammes — MÉDIKA, VITAMINE, VITAPRO, VITAMINE BANQUE POPULAIRE, BIORYTHM and VIVAZEN. Only BIORYTHM and VIVAZEN have their own published CG, so for the other four the règlement mutualiste is the only public contract wording that exists.

    TRAP: The nine MAAF_Intercalaire_*.pdf files are contractual, not marketing: each one states it either adds to or 'se substitue' to named articles of the Multirisque professionnelle conditions générales (réf. 11031). They are typed conditions_generales here because that is the role they play. They live under an 'Autres_documents/' path next to genuine prevention leaflets, so a path-based filter will either drop all of them or keep the leaflets.

  fetch_tier: plain-urllib-only          # maaf.fr sits behind DataDome. Measured, not inferred: identical URL + 
