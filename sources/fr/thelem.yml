insurer:
  slug: thelem
  name: Thélem assurances
  website: https://www.thelem-assurances.fr
  segment: particuliers
  notes: |
    Société d'assurance mutuelle à cotisations variables (Code des assurances), ACPR-
    supervised, in the register as THELEM ASSURANCES with 14 authorised branches, group
    THELEM. First-party carrier: every IPID names Thélem itself as the insurer, so none of
    the French brand/carrier ambiguity applies here.

    The whole public library is one page of direct .pdf hrefs, so plain HTTP is enough and
    no renderer is needed.

    GOTCHA 1: the site's anchor labels and the PDFs' own `Produit :` lines disagree on ten
    documents, and on TA 483 / TA 621 they are effectively swapped between 'multirisque
    immeuble' and 'multirisque habitation PNO'. product_name below follows the DOCUMENT,
    not the site. Detail in _meta/discovery/fr/thelem.md.

    GOTCHA 2: the CMS serves some files from two /YYYY/MM/ paths. Two of those pairs are
    neither byte- nor text-identical, differing only by a trailing product-code fragment,
    so neither hash de-duplicates them. Three re-uploaded URLs are deliberately absent.

    ALL IPID, no conditions générales: Thélem publishes what the DDA requires and no more.
    Extractions will be thinner than Belgium's CG-based ones by construction, not by fault.
  fetch_tier: plain          # plain HTTP 200 on the listing page and on every PDF
