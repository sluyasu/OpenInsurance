insurer:
  slug: maif
  name: "MAIF"
  website: "https://www.maif.fr"
  segment: particuliers
  notes: |
    MAIF is a first-party carrier for its whole non-life range — every non-life IPID prints "MAIF - Entreprise d’assurance immatriculée en France et régie par le Code des assurances - 775 709 702" and every non-life CG prints "MAIF - Société d’assurance mutuelle à cotisations variables ... identifiée sous le numéro SIREN 775 709 702". Two exceptions inside the same library. (1) Life, death, funeral, borrower and savings products are carried by the group subsidiary MAIF VIE: "MAIF VIE - Entreprise d’assurance immatriculée en France et régie par le Code des assurances - LEI 969500ZQDM3R7A4STD74" (IPIDs) / "MAIF VIE - Société anonyme au capital de 122 000 000 € - RCS Niort 330 432 782" (notices). Sollicitudes and Assurance Emprunteur MAIF are group contracts taken out with MAIF VIE by the association ASAP; the PER is taken out with MAIF VIE by GERP Futurs Solidaires. (2) Assurance Loyers Impayés is NOT carried by MAIF at all. The CG says verbatim: "Le contrat Assurance Loyers Impayés est un contrat proposé par la MAIF, géré par l’intermédiaire de Gestion Assurances SA (une marque de la société Groupe Solly Azar) et assuré auprès de SADA Assurances (porteur du risque)" — and a second, parallel set of documents says the same sentence with "assuré auprès de WAKAM (porteur du risque)". Both carrier versions are live side by side on the habitation pages (SADA ref. CG SADA GLI_V1-SA_MF-01/07/2021 – Mars 2023; WAKAM ref. CGWAKAMGLIMF_092025 – Septembre 2025). The savings/livrets documents are Socram Banque products where MAIF is only an intermédiaire en opérations de banque — no insurer at all.

    NOT PUBLISHED: MAIF does publish full conditions générales for motor and household — that is the answer to the interesting question about this insurer — but it publishes them invisibly. 23 real conditions générales are on the public server, including Assurance Auto-Moto Vam (78 p), Assurance Habitation (114 p), Habitation Jeunes (54 p), Propriétaire Bailleur (54 p), Protection Juridique (42 p), Vélo (44 p), Navigation (59 p), corporelle conducteur-passagers Pacs (57 p), Praxis Solutions (60 p), Assurance Professionnelle (54 p), Auto Professionnelle (84 p), Offre Métiers de l’Éducation (56 p), Raqvam A&C (70 p) and Vam A&C (90 p). Not one of them is linked from a product page: they are reachable only from the subscription funnels' JavaScript, or from nowhere at all. A crawler that only reads product pages, as an ordinary visitor does, would conclude MAIF publishes IPIDs only. What is genuinely absent: (a) no conditions générales for the entreprise range — Multirisque Entreprises and Véhicules entreprises are IPID-only; (b) no conditions générales for the construction range — Dommages-Ouvrage, Tous Risques Chantier and Responsabilité Civile Maître d’Ouvrage are IPID-only, as is Auto-mission; (c) no conditions particulières at all except one blank Raqvam A&C specimen (11-2021); (d) no health insurance documents — MAIF has no individual santé product and distributes Harmonie Mutuelle for collective santé, with nothing published on maif.fr; (e) no pet-insurance documents (partner Animaux Santé, quote handled off-site); (f) no cyber insurance contract for individuals (the 'Assurance Cyber Risques' page sells F-Secure software and points to Cybermalveillance.gouv.fr — no insurance product, no IPID); (g) no standalone scolaire contract — school cover sits inside the habitation/Raqvam contracts; (h) no per-contract tariff schedules, only two global barèmes de frais; (i) no group-prevoyance or prevoyance-dirigeant documents for the entreprise range; (j) the accessible 'version adaptée' of the conditions générales is members-only.

    TRAP: A robots-respecting crawler gets nothing: robots.txt has 'Disallow: /*.pdf$'. The PDFs themselves are served normally to any client.

    TRAP: There is no documents page anywhere on maif.fr. Every candidate hub URL (/annexes/documents-contractuels, /annexes/documentation-contractuelle, /annexes/conditions-generales, /annexes/documents-utiles) 404s, and /annexes/toutes-nos-solutions and /annexes/plan-du-site contain zero PDF links.

    TRAP: Product pages link ONLY the IPID. Not one conditions générales is linked from any HTML page on the site. The CGs are referenced exclusively inside the quote funnels' JavaScript: /front/<app>/<version>/static/js/index.js. Fetch the /services-en-ligne/... page, read its <script src> for /front/…, fetch that bundle, grep for '.pdf'. Apps seen: aha (habitation), ahj (habitation jeunes), apb (propriétaire bailleur), vehicule (VAM), protection-corporelle-vehicule (PACS), protection-juridique, praxis, nautis (navigation), ome (métiers de l’éducation), rassurcap, sollicitudes, assurance-vie, simulateur-assurance-vie, assurance-pro, cse, credit-auto, telethon.

    TRAP: Filename convention, which is what actually unlocks the library: https://www.maif.fr/files/live/sites/maif-fr/files/pdf/documentation-contractuelle/<category>/<prefix>-<product>.pdf. Categories: mobilite, habitation, famille-vie-quotidienne, epargne-financements, epargne-financements/livret-epargne-autrement, associations-collectivites, enseignants, entreprises, travailleurs-independants, commun. Prefixes: document-information-, conditions-generales-, conditions-particulieres-, notice-, notice-information-, document-informations-cles-, tableau-frais-, tableau-garanties-, tableau-limite-garanties-, bareme-frais-, fiche-informations-, conditions-tarifaires-. Swapping document-information- for conditions-generales- on a known IPID path hits about half the time.

    TRAP: Only 57 of the 77 documents are linked from an HTML page. 11 appear solely inside the quote-flow JavaScript (including the auto, habitation, habitation jeunes, propriétaire bailleur, protection juridique, PACS, praxis and OME conditions générales), and 9 more are served with 200 but referenced nowhere at all — mobilite/conditions-generales-assurance-velo.pdf, mobilite/conditions-generales-assurance-navigation.pdf, mobilite/document-information-assurance-navigation.pdf, epargne-financements/notice-ars.pdf, travailleurs-independants/conditions-generales-assurance-professionnelle.pdf, travailleurs-independants/conditions-generales-assurance-auto-professionnelle.pdf, associations-collectivites/conditions-generales-raqvam-associations-et-collectivites.pdf, associations-collectivites/conditions-generales-vam-associations-et-collectivites.pdf, associations-collectivites/conditions-particulieres-raqvam-associations-et-collectivites.pdf. Those 9 exist only because the filename pattern was probed. Each document carries a `linked_from` field recording which of the three it is.

    TRAP: /files/default/sites/maif-fr/files/pdf/... always 404s; /files/live/sites/maif-fr/files/pdf/... is the live tree. Two habitation pages ship dead /files/default/ links (etats-des-lieux, guide-proprietaires-bailleurs, modele-bail-*, maif-ali-conditions-eligibilite-justificatifs, notice-information-contrats-location-usage-residence-principale). Rewriting default→live recovers the file.

    TRAP: Anchor text is almost useless: 27 of the IPIDs are linked as the generic string "Document d'information sur le produit d'assurance ( PDF - NNN Ko )" with no product name. 44 of 77 documents have site_label_diverges = true, 17 have no anchor text at all. Always take the product name from the PDF.

    TRAP: The IPID header block is NOT at the top of the extracted text. PyMuPDF returns the body first; the "<famille> / Document d’information sur le produit d’assurance / <carrier legal line> / <product name> / <internal code + MM/YYYY>" block lands mid-string. Search the flattened text for 'Document d’information sur le produit d’assurance' and read ±350 characters around it. MAIF does not use the usual 'Compagnie :' / 'Produit :' labels at all.

    TRAP: Every MAIF-issued conditions générales PDF embeds the product's IPID as its final pages. Do not treat the trailing 'IPID XXX' text as a second document, and do not conclude the CG is an IPID.

    TRAP: Edition dates are printed as a bare MM/YYYY or MM/YY on the very last line of the last page, next to an internal reference ('2442 AHA - 01/2025', 'IPID VAM 10/2025', 'NI14 - 01/24', 'CGWAKAMGLIMF_092025'). They are never in the filename and never in the PDF metadata title. A few files carry no date at all (conditions-generales-assurance-loyers-impayes, tableau-limite-garanties-ali, document-information-produit-WAKAM).

    TRAP: PDF /ModDate is not the edition date — several files show a 2026 modification date on a 2023 edition.

    TRAP: The accessibility ('version adaptée') build of the conditions générales is NOT public: the bundles route it to /gateway/api/redirect/espaceperso?redirect_uri=document-adapte?codeDocument=014, i.e. behind the member login. Separately, some IPIDs exist in two public renderings, RGAA and plain (see dropped_duplicates).

    TRAP: document-information-produit-WAKAM.pdf has a text layer but only ~half the text extracts (3 485 chars vs 7 264 for its SADA twin); the rest is vector art. commun/convention-aeras.pdf extracts page 1 cleanly then returns scrambled glyphs (broken font encoding) from page 2. Both are flagged in the records.

    TRAP: Also inside documentation-contractuelle/ but deliberately excluded as non-contractual: associations-collectivites/declaration-sinistre-telethon.pdf and associations-collectivites/releve-identite-bancaire.pdf (both verified 200, they are forms). There is also a separate form tree at /maiffr/documents/pdf/formulaires/<name>.pdf (guide-5-etapes-creer-asso, guide-financements-associations, guide-protection-salaries, guide-tiers-lieux).

    TRAP: Excluded, real, and outside the contractual tree: /files/live/sites/maif-fr/files/pdf/particuliers/habitation/notice-information-contrats-location-usage-residence-principale.pdf (lease notice under housing law, not insurance, and its text layer is fully scrambled), .../particuliers/habitation/maif-ali-conditions-eligibilite-justificatifs.pdf (Solly Azar underwriting checklist), .../particuliers/auto-moto/maif-convention-aeras.pdf (44 p raw text of the 2023 AERAS convention; the 12 p MAIF note on it is the one kept), and .../particuliers/epargne-financements/{publication-informations-durabilite-ars,declaration-incidences-negatives,rapport-esg-climat-maif-vie}.pdf (SFDR/ESG disclosures).

    TRAP: Life-side product names are opaque: Vam = auto/moto, Raqvam = multirisque, Praxis Solutions = GAV, Rassurcap Solutions = temporary death cover, Sollicitudes = funeral cover, ARS = Assurance vie Responsable et Solidaire, AEM = Assurance Emprunteur MAIF, OME = Offre Métiers de l’Éducation, APB = propriétaire bailleur, AHJ = habitation jeunes, AAP = auto professionnelle, ALI/GLI = loyers impayés.

    6 document(s) enumerated but deliberately absent below; see the
    discovery file for the list and the reason.

  fetch_tier: plain          # No WAF, no blocking, no rate limiting observed. curl and Python urllib
