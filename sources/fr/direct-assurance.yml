insurer:
  slug: direct-assurance
  name: Direct Assurance
  website: https://www.direct-assurance.fr
  segment: particuliers
  notes: |
    NOT A CARRIER. Direct Assurance is a brand of Avanssur SA, which the documents describe
    as "mandataire d'assurance d'AXA France IARD et courtier d'assurance - Orias n° 19006337".
    Neither Direct Assurance nor Avanssur appears in the ACPR register, which is correct: the
    register lists risk carriers, ORIAS lists intermediaries. The brand slug is kept per the
    Belgian `lar` precedent and the carrier is recorded per document.

    THE CARRIER IS NOT CONSTANT across this one library. Three AXA entities sign these eleven
    documents, all three present in the ACPR register:
      AXA France IARD               auto, auto connectée, habitation, and the moto IPID
      AXA Assurances IARD Mutuelle  the moto conditions générales
      AXA France Vie                santé
    The moto IPID and its own conditions générales name different entities; both are recorded
    as found rather than reconciled.

    Santé is a contrat d'assurance de groupe à adhésion facultative between AXA France Vie and
    the Association Conseil Branche Santé (ACBS), which is why its master document is a notice
    d'information. Mapped to conditions_generales because that is the role it plays.

    Unlike Thélem, this insurer publishes REAL conditions générales (57, 50 and 80 pages).
    Three documents exceed extract.MAX_TEXT_CHARS (240 000) and will be truncated with a note
    in `gaps`. That is the documented behaviour, not a failure.
  fetch_tier: plain          # listing page 200, PDFs served from directassurance.cdn.prismic.io
