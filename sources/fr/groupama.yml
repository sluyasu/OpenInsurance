insurer:
  slug: groupama
  name: "Groupama"
  website: "https://www.groupama.fr"
  segment: particuliers
  notes: |
    Groupama is not an intermediary brand — the risk sits inside the group — but the published documents deliberately do NOT name which regional mutual carries it. The non-life contract documents all print the same substitution formula: « La Caisse Locale d’Assurances Mutuelles Agricoles dénommée ci-après GROUPAMA, (identifiée aux Conditions Personnelles) ayant souscrit un traité de Réassurance emportant substitution auprès de : La Caisse Régionale d’Assurances Mutuelles Agricoles (identifiée aux Conditions Personnelles) » (Profil élus DDG p.1 and Tableau des montants p.1; the Flotte Automobile CG says the same with « Conditions Particulières »). The IPID goes further and prints only « Compagnie : GROUPAMA – Entreprise d’assurance française ». The named entity is therefore resolved per policy in the Conditions Personnelles/Particulières, which are never published. Conclusion for the slug question: ONE slug, 'groupama', for the non-life documents — splitting into 11 regional slugs would be inventing information the documents do not carry. Life, retirement, obsèques and the TNS prévoyance examples are different: they name 'Groupama Gan Vie – Société Anonyme au capital de 1 371 100 605 € – 340 427 616 RCS Paris' as assureur, so those documents belong to the Groupama Gan Vie carrier, not to a régionale. The health CCSF tables name 'Groupama Assurances Mutuelles, pour le compte des Caisses Régionales d’Assurances Mutuelles Agricoles' (the group holding acting for the régionales). Assistance in the Profil élus and Flotte contracts is carried by Mutuaide Assistance. The only documents on the site that DO name an individual régionale are the certificats mutualistes notices (Groupama Grand Est, Groupama Rhône-Alpes Auvergne) — but those are securities notices, not insurance contracts, and are excluded from the list below.

    NOT PUBLISHED: No conditions générales, no notices d'information and no IPIDs for any retail line: auto, moto, vélo/EDPM, habitation, santé individuelle, GAV, scolaire, chasse, navigation, voyage, animaux, dépendance, emprunteur, protection juridique. No conditions particulières of any kind. Nothing contractual for the agricole line at all (no multirisque agricole, no récolte/grêle, no engins/tracteurs), even though Groupama is France's main agricultural insurer. Nothing contractual for the professionnels/entreprise lines currently on the site either — the only CG that exist (flotte automobile) survive as orphaned CDN files from the retired groupama-entreprises.fr. What IS published: one complete non-life contract set for local elected officials (Profil élus: dispositions générales 47 p. + IPID + tableau des montants et franchises + fiche L.112-2), the Groupama Gan Vie PRIIPs range (DIC/DIS/frais for Modulation, Premium, Capitalisation, Horizon Retraite, Nouvelle Vie PERIN, fonds euros, structured supports, Sérénité Obsèques) and the CCSF 'engagement lisibilité' benefit/reimbursement tables for santé and prévoyance — most of which print 'Document non contractuel' on their own face. Retail conditions générales are delivered only inside the quote tunnel (devis.groupama.fr, robots-blocked) and the authenticated espace client.

    TRAP: Groupama does NOT publish conditions générales for its retail lines. Auto, habitation, santé individuelle, GAV, moto, vélo, scolaire, bateau, chien/chat, voyage, protection juridique, emprunteur: crawling all 1645 sitemap URLs produced zero CG, zero IPID and zero notice d'information for any of them. The CG are handed over inside the quote tunnel (devis.groupama.fr, robots 'Disallow: /') and in the espace client (espaceclient.groupama.fr, Keycloak login). Do not keep hunting for a retail library — there is none.

    TRAP: The agricole line, which is Groupama's historic core, publishes nothing contractual at all. /assurance-agricole/ has 86 sitemap URLs (multirisque agricole, récolte/chiffre d'affaires cultures, prairies, matériels et tracteurs, bâtiments, RC professionnelle, méthanisation…) and every PDF linked from them is a prevention brochure, a flyer or a third-party statistic. Nothing with the 'agricole' branch slug exists in this result.

    TRAP: robots.txt disallows /documents/* — that is the dead Liferay CMS path, not a document library. https://www.groupama.fr/documents/ returns 502 and every archived /documents/20282/… URL 502s too. The equally tempting legacy path /file/multimediaelement/… (which in 2009-2016 did host real CG: 'conditions générales conduire', 'conditions générales gav', 'conditions générales privatis', 'conditions generales gsa') is a clean 404 today. Both were checked; do not re-derive.

    TRAP: groupama-entreprises.fr 301s to groupama.fr/assurance-professionnels/, but three of its contractual PDFs are still served from the Contentful CDN and are the only full non-life Conditions Générales Groupama publishes anywhere: Assurance Flotte Automobile CG (87 p.), its Annexe Protection Juridique Automobile and its Convention Spéciale Assistance > 3,5 T. NO page on groupama.fr links them — they were found via a search engine and then verified live (200, %PDF). They are in the list with site_label '(none — orphaned CDN asset)'. If the wiki only wants documents reachable from a live page, drop these three and the insurer has zero conditions générales outside collectivités.

    TRAP: Contentful space id is 7awcp71bzphk (assets.ctfassets.net / images.ctfassets.net / downloads.ctfassets.net). Assets cannot be enumerated without a delivery token, and no token was used. A Wayback CDX prefix query on that space returns ~720 archived PDFs and is the cheapest way to see what else has ever been there — but it is overwhelmingly press releases, SFCR/rapports financiers, règlements de jeux-concours, prevention leaflets and BANKING conditions générales (Livret A, LDDS, LEP, PEL, CEL, BAQ 'banque au quotidien', crédit immobilier). Those banking CG belong to Groupama Banque/Orange Bank, not to an insurance branch — do not let the phrase 'conditions générales' pull them in.

    TRAP: Six 'Notice d'information' PDFs on /regions/grand-est/espace-financier/ and /regions/rhone-alpes-auvergne/espace-financier/ (40-41 p. each) are notices for CERTIFICATS MUTUALISTES — a capital instrument, not an insurance contract. They are deliberately excluded from documents[]. They are, however, the only files on the whole site that name an individual regional carrier ('Caisse de Réassurance Mutuelle Agricoles du Grand Est', 'Caisse de Réassurance Mutuelle Agricole de Rhône-Alpes Auvergne'), which is why they look attractive. URLs kept here so nobody re-fetches them: GGE_-_notice_d-information_2022.pdf, GGE_-_notice_d-information_2023.pdf, Notice_d-information_2020.pdf, Notice_d-information_auto-detenus_2024_GGE.pdf, Notice_d-information_auto-detenus_version_2025_GGE_signee.pdf, Notice_d-information_certificats_mutualistes_12_2025_GRAA_signee.pdf — all on assets.ctfassets.net/7awcp71bzphk/.

    TRAP: document_type choice to be aware of: the 28 life/retirement documents are PRIIPs 'Document d'informations clés' (DIC) and 'Document d'informations spécifiques' (DIS), not IPIDs. They are typed product_sheet, because an IPID/DIPA is the non-life form and the only real IPID Groupama publishes is Assurance-Collectivites-Groupama-DIPA-Profil-Elus.pdf. Remap DIC/DIS to 'ipid' at ingest if the wiki treats them as the life-side equivalent.

    TRAP: Two same-product pairs are genuine older/newer editions, both still linked, both kept: DIC Groupama Sérénité Obsèques octobre 2021 (on a /conseils/ page) vs mars 2023 (on the product page); and DIS Gestion Déléguée Profil Tranquillité Durable 12/02/2025 (on /assurance-vie/groupama-premium/) vs 19/05/2026 (asset 84b278d9…). Everything else that looked like a duplicate is a parallel variant: the 18 DIS files run 0.90-0.99 text-similar to each other but each names a different gestion-déléguée profile on its first line.

    TRAP: CASE COLLISION, real: Transparence-des-frais-Groupama-Nouvelle-Vie.pdf and transparence-des-frais-groupama-nouvelle-vie.pdf are two different Contentful assets whose basenames differ only in case. They are NOT the same file (text ratio 0.50): different minimum payments, different fund fees (1,88% vs 1,72%), 'Gestion à horizon' vs 'Gestion pilotée par horizon'. On a case-insensitive filesystem one silently overwrites the other.

    TRAP: Site anchor text is unreliable on /assurance-vie/gestion-deleguee/: asset 84b278d9… is linked as 'Document d'Informations Clés (DIC) – Fonds Euros' but is the DIS Tranquillité Durable, and 48913f30… is linked as 'Profil Modéré' but is the Modéré Développement Humain (diversifié) variant. The document wins in both cases.

    TRAP: Every PDF downloaded had a text layer — 0 of 59 were image-only.

    TRAP: Two Groupama sub-brands were seen but not pursued because they are separate ACPR carriers with their own sites: Amaline Assurances (Amaguiz) and Société Française de Protection Juridique (Groupama Protection Juridique). Mutuaide Assistance carries the assistance guarantees inside the Groupama contracts.

    20 document(s) enumerated but deliberately absent below; see the
    discovery file for the list and the reason.

  fetch_tier: plain          # Everything on www.groupama.fr answered 200 to both curl and Python url
