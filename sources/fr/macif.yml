insurer:
  slug: macif
  name: "Macif (MACIF - Mutuelle Assurance des Commerçants et Industriels de France et des Cadres et Salariés de l'Industrie et du Commerce)"
  website: "https://www.macif.fr"
  segment: particuliers
  notes: |
    Macif is itself a risk carrier, but only for the P&C book. Across this library the carrier named inside the document changes with the product, and there are SEVEN distinct carriers plus one non-insurance counterparty:
    1. 'Macif - France - Société d'assurance mutuelle à cotisations variables - SIREN n° 781 452 511' (the 'Compagnie :' line of every P&C IPID) = 'MACIF - MUTUELLE ASSURANCE DES COMMERÇANTS ET INDUSTRIELS DE FRANCE ET DES CADRES ET SALARIÉS DE L'INDUSTRIE ET DU COMMERCE. Société d'assurance mutuelle à cotisations variables. Entreprise régie par le Code des assurances.' (the closing legal footer of every conditions générales) - auto, moto, habitation, chasse, plaisance, GAV, pro.
    2. 'Macif Santé Prévoyance (SIREN n° 779 558 501), mutuelle enregistrée en France et régie par le Livre II du Code de la mutualité' - health, prévoyance, obsèques, dépendance. NOTE: the same SIREN 779 558 501 is printed as 'Apivia Macif Mutuelle' in the older documents and as 'Macif-Mutualité' in the oldest ones. Same legal entity, three successive names; the library serves all three side by side.
    3. 'Macif Vie' (ACPR: MACIF VIE SE), printed as 'Macif Vie - Entreprise régie par le Code des assurances' - assurance vie and PER since ~2025. Its predecessor name 'Mutavie' is still printed on the older notices and fee tables in the same folder.
    4. 'Thémis - Société Anonyme au capital de 2 499 840€ - SIREN n°582 067 922' - all three protection juridique IPIDs.
    5. 'la Mutuelle Nationale des Fonctionnaires des Collectivités Territoriales (MNFCT)' - the Macif Santé des Territoriaux / Garantie Santé Territoriaux range. Macif distributes, MNFCT carries.
    6. 'AXA FRANCE IARD et AXA FRANCE VIE' + 'Fragonard Assurances' (trading as Mondial Assistance) - the Socram Banque payment-card insurance and assistance notices.
    7. 'MNCAP SA' - the Perte d'Emploi cover attached to Garantie Emprunteur Macif; 'MACIF VIE et MATMUT VIE' jointly carry the Socram Banque consumer-credit borrower cover.
    Several health documents also print the split explicitly: 'Le contrat Macif Mutuelle Santé, distribué par la Macif, est assuré par Macif Santé Prévoyance' - i.e. Macif is the distributor, the mutuelle is the carrier. MACIFILIA (in the ACPR register) is named in no document in this library.

    NOT PUBLISHED: NO LIBRARY PAGE IS REACHABLE ON THE MAIN SITE. Macif publishes no browsable 'documents contractuels' index that this crawl could open on www.macif.fr, because DataDome blocks every HTML page, robots.txt and sitemap.xml. Only one true library page could be read anywhere in the group: https://www.macifvie.fr/documents-des-contrats/ (4 life/retirement products, 8 PDFs). Everything else in this result is a PDF confirmed live on the publisher's own media path whose linking page could not be loaded - so site_label is null for 165 of 173 documents, site_label_diverges is therefore unknown (null) for those, and it cannot be established which of them Macif still links from a live product page versus merely leaves reachable. Treat the set as 'live on the host', not as 'currently advertised'.

    TRAP: www.macif.fr splits its edge: HTML/robots.txt/sitemap.xml are DataDome-protected (403 to httpx AND to urllib), but /files/live/sites/maciffr/files/** serves PDFs at 200 without any challenge. Do not conclude 'unreachable' from the HTML 403.

    TRAP: Because no HTML page on www.macif.fr can be loaded, site_label is null for all 165 macif.fr documents. Their URLs come from the Internet Archive CDX index of macif.fr PDFs restricted to the publisher's own dipa/ and conditions_generales_* folders - i.e. URLs the archive actually crawled from links, not probed - and every one was then re-requested against the live host. No URL space was enumerated. 22 archive URLs returned 404 or an error live and were dropped, so the archive is demonstrably stale in places.

    TRAP: The date in a Macif filename is the CMS upload date, NOT the edition. CG_habitation_RP_protectrice_202101.pdf prints 'HAB/PROT RP/05 - 05/18' and is byte-identical to CG_habitation_RP_protectrice_201805.pdf. The real edition is in the reference code on the last page, format <FAMILY>/<PRODUCT>/05 - MM/YY - N<nnn>. Parse that, not the filename.

    TRAP: CG_Garantie_Accident_20211218.pdf and CG_Garantie_Accident_20230117.pdf both print the same reference code 'PREI/ACC/05 - 04/21 - N754' but differ in extracted text (83377 vs 83318 chars). Same printed edition, two silently different files - do not treat the reference code as a unique key.

    TRAP: Files named *_synthese_* in conditions_generales_prevoyance/NID/ are NOT summaries: NID_synthese_assurance_sante.pdf is byte-identical to the full 38-page NID_assurance_sante.pdf.

    TRAP: French IPIDs here print no edition date: 34 of the 59 retained DIPA files have no date anywhere, in the document or the filename. That is the publisher's behaviour, not a parsing failure.

    TRAP: Apivia Macif Mutuelle, Macif-Mutualité and Macif Santé Prévoyance are ONE entity (SIREN 779 558 501) under three successive names, and Mutavie is the former name of Macif Vie. The library serves documents naming all of them concurrently, so carrier strings are not stable over time for the same product.

    TRAP: www.macifvie.fr answers about 3 requests before returning 403 for ~35 s. Serialise with a long sleep or you will record false negatives.

    TRAP: httpx in this environment has no brotli decoder. Sending 'Accept-Encoding: gzip, deflate, br' makes a genuine 200 look like a 211-byte binary blob. Drop br.

    TRAP: www.macif.fr also publishes, in the same conditions_generales_banque folder, ~40 non-insurance PDFs: Socram Banque account conventions and tariff guides, FBF/lesclesdelabanque educational mini-guides, SFDR and ESG-climate corporate reports. They are excluded here - they are banking or corporate documents, not insurance contracts.

    TRAP: Three filename collisions across the two hosts, all of them DIFFERENT documents that would overwrite each other in a flat download directory: MultiVie-Frais.pdf exists on both macif.fr (Mutavie, 06/2024) and macifvie.fr (Macif Vie, 06/2026); PlanEpargneRetraite-Frais.pdf likewise (Mutavie 06/2024 vs Macif Vie 06/2026); and NI-PlanEpargneRetraite.pdf / ni-planepargneretraite.pdf differ only in case. Key on URL, never on basename.

    8 document(s) enumerated but deliberately absent below; see the
    discovery file for the list and the reason.

  fetch_tier: waf          # www.macif.fr is behind DataDome. Every HTML page, /robots.txt and /sit
