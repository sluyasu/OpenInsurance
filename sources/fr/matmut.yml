insurer:
  slug: matmut
  name: "Matmut"
  website: "https://www.matmut.fr"
  segment: particuliers
  notes: |
    Matmut is itself a risk carrier, but the matmut.fr document library is a GROUP library spanning eleven distinct carriers across all three French insurance codes plus two non-insurance entities. Per-document attribution is in `carrier`; the entities as printed are:
    (1) CODE DES ASSURANCES — 'Matmut (Mutuelle assurance des travailleurs mutualistes), Société d'assurance mutuelle à cotisations variables ... N° Siren 775 701 477' signs the mass-market motor, household, GAV, chasse, navigation, scolaire and Matmut Pro range (89 docs). 'Matmut & Co, Société anonyme au capital de 66 015 268 € entièrement libéré, N° 487 597 510 RCS Rouen' signs the entire 'Initiale & Co / Distinguo & Co' range and Assur'4Pattes (31 docs). 'Inter Mutuelles Entreprises, Société Anonyme à directoire et conseil de surveillance ... N° 493 147 011 RCS Rouen' (Niort, 118 avenue de Paris) signs the collectivités / copropriétés / risques immobiliers / bris de machines / pertes d'exploitation range (8 docs) — this entity is NOT in the 13-carrier SGAM list given in the brief. 'AMF Assurances (Assurance Mutuelle des Fonctionnaires et Assimilés), Siret 784 394 397 00029' signs the agents publics professional cover (2 docs). 'Matmut Vie, Société Anonyme au capital de 35 887 500 €, N° 344 898 358 RCS Rouen' signs life, obsèques and prévoyance (11 docs).
    (2) CODE DE LA MUTUALITÉ — the health arm is NOT Matmut Mutualité as the brief assumed. Every santé product document names 'Mutuelle Ociane Matmut, Mutuelle soumise aux dispositions du Livre II du Code de la mutualité, immatriculée sous le n° 434 243 085, siège social 35 rue Claude-Bonnier 33054 Bordeaux' (56 docs) — the Bordeaux Ociane entity, not the Rouen one. 'Matmut Mutualité, Sirene 775 701 485' appears only as (a) the SOUSCRIPTEUR of the Matmut Vie group life/obsèques contracts, (b) the mutualist co-signer of the student and Matmut/Smac contracts, and (c) its own statutes. Only 2 documents carry Matmut Mutualité as the named carrier.
    (3) PROTECTION JURIDIQUE — confirmed as asked: /pro/pdf/notice-information-protection-juridique.pdf names the dedicated carrier, not the main one. Its cover reads verbatim: 'Contrat collectif d'assurance de Protection Juridique souscrit par Mutuelle Ociane Matmut auprès de Matmut Protection Juridique — Ayant reçu agrément par arrêté du 1er octobre 1999 pour pratiquer les opérations correspondant à la branche 17 (Protection Juridique)'. MPJ is 'Société Anonyme au capital de 7 500 000 € entièrement libéré, N° 423 499 391 RCS Rouen'. Caution: the string 'Matmut Protection Juridique' also appears in ~75 other documents, but there it is only the delegated provider of a Protection Juridique SUB-GUARANTEE inside a contract carried by someone else — do not read those as MPJ-carried.
    (4) THIRD-PARTY CARRIERS BEHIND MATMUT BRANDS — the 'Complice' savings range is not Matmut-carried at all. notice-complice-vie.pdf names 'Assureur : Cardif Assurance Vie ... 732 028 154 RCS Paris' and is branded 'AEP - ASSURANCE EPARGNE PENSION®, une marque commerciale de groupe BNP PARIBAS CARDIF'; notice-complice-retraite.pdf names 'Cardif Retraite ... RCS Paris 903 364 321' with the UFEP association as souscripteur, and says the plan is 'distribué par Matmut sous le nom commercial Complice Retraite'. The emprunteur CG (CG-altus-evolution.pdf) is carried by 'MUTLOG SIREN n° 325 942 969' and 'MUTLOG Garanties SIREN n° 384 253 605'. Matmut is a pure intermediary on these three.
    (5) CO-INSURANCE POOLS — the branch-level (CCN) group health contracts are co-insured. CCN 1951, CCN 1966 and CCN ALISFA name Mutuelle Ociane Matmut as ONE of several co-insurers alongside AESIO Mutuelle, Harmonie Mutuelle, MGEN, MNH, Malakoff Humanis Prévoyance, Intégrance (Groupe APICIL), Solimut Mutuelle de France and AG2R, varying by branch. Attributing these to Matmut alone would be wrong; the `carrier` field flags the pool.

    NOT PUBLISHED: No conditions particulières of any kind — those are per-policyholder and live behind the espace personnel (/app/ContratsAttestationsInternet*, all Disallow'd). No public tariff grid or premium schedule for the insurance products (the only conditions_tarifaires published are promotional-offer riders, plus one Socram Banque banking tariff that is out of scope). No IPID for several products that do have conditions générales: the four Inter Mutuelles Entreprises wordings (risques immobiliers, bris de machines, pertes d'exploitation, multigaranties collectivités) publish IPIDs only under different product codes, and CGLLDPART / CG-livret-matmut have none because they are not insurance. No conditions générales published for the Complice Vie / Complice Retraite savings range — only the Cardif notice d'information. No English-language contractual documents. No machine-readable index: no JSON/CSV catalogue, no PDF in sitemap.xml, no directory listing (all /doc/ paths 308-redirect); the /services-en-ligne/conditions-generales HTML page is the only catalogue and it must be scraped.

    TRAP: THE LIBRARY PAGE IS NOT IN THE SITEMAP. https://www.matmut.fr/services-en-ligne/conditions-generales carries 151 PDF anchors (112 of the kept documents plus the 37 tariff sheets) and is absent from sitemap.xml. Go there first; everything else is mopping up. Its four <h2> sections are 'Conditions Générales Matmut', '… Matmut & Co', '… Distinguo & Co', '… Initiale & Co' — which is itself the carrier split.

    TRAP: sitemap.xml contains 0 PDF URLs out of 2 589 entries. Do not waste a pass expecting product documents there; use it only to enumerate product pages. 1 998 of the 2 589 URLs are /conseils/ blog posts and can be skipped outright.

    TRAP: THE SERVER IS CASE-INSENSITIVE (IIS). CGALI.pdf, cgali.pdf and CGAli.pdf all return the same bytes — verified by sha256 on several pairs. Probing for lower/upper-case 'mirror' files yields 46 false 200s that are not new documents. Any pipeline that flattens these into one directory on a case-insensitive filesystem (macOS default) will silently overwrite. Normalise the basename to lowercase and de-duplicate by sha256 before writing to disk.

    TRAP: /services-en-ligne/doc/CG/ and /services-en-ligne/doc/IPID/ mirror each other by product code (CGSCOL ↔ IPIDSCOL, cgauto4dmatmut ↔ ipidauto4d). Tempting to complete the set by guessing the counterpart — it does not work: the genuinely missing counterparts (CGIMEASS, CGSMAC, IPIDLLDPART, IPID for cgbrismachine / cgpertesexploitation / CGRisquesImmobiliers) all 404, and every apparent hit is a case variant. 184 probes, 0 real new documents.

    TRAP: robots.txt Disallow lines leak two PDF paths that no page links, which is how you learn the /pro/pdf/ and /services-en-ligne/doc/ conventions. Read robots.txt for paths, not just for the sitemap.

    TRAP: EDITION DATES ARE IN A FOOTER REF CODE, NOT A DATE FIELD, AND THE SEPARATOR IS INCONSISTENT. Conditions générales print e.g. 'CG MAV - 01/26', 'CG RP - 12/23', 'MC.30 – 11/24' (MM/YY). IPIDs print 'IPID.RP–12-23', 'IPID.JEUNES – 05-24' (MM-YY with a dash) and some print 'IPID.MOM.SVB– 0925' (MMYY, no separator at all). A single MM/YY regex finds roughly half of them. 43 of 203 documents genuinely carry no printed date — chiefly the CCN tableau-de-garanties sheets. Beware: those sheets contain '12/2026' in the benefit tables, which is a cover-validity date, not an edition.

    TRAP: TWO GENUINE EDITION PAIRS, NOT DUPLICATES. /services-en-ligne/CG/MC30.pdf is 'MC.30 – 05/23' (65 pages) while /services-en-ligne/doc/CG/MC30.pdf is 'MC.30 – 11/24' (66 pages) — same product 'Caducée', two real editions, 0.88 line-level similarity, the newer one adds a cover page. Both kept. Note the two live under different directories with the same basename.

    TRAP: /prevoyance/pdf/Notice-MPO.pdf and /services-en-ligne/doc/IPID/Notice-MPO.pdf are two revisions of the same 'Matmut Prévoyance Obsèques' notice (0.83 line similarity; one says 'L'assureur apportera à l'adhérent le conseil adapté', the other 'L'adhérent est invité à demander conseil auprès de son assureur'). NEITHER carries a printed edition date, so they cannot be ordered — do not guess. Both kept, edition_date null.

    TRAP: A TYPO IN THE PRINTED SIREN. CGCHASSE.pdf and CGMAV-serenite.pdf print 'Immatriculée au RCS de Rouen no 755 701 477'. Matmut's real Siren is 775 701 477 (as printed correctly in CGMAV.pdf and everywhere else). Digit transposition in the source document — do not create a second carrier entity from it.

    TRAP: AN INTRANET HOST LEAKS INTO THE PUBLIC SITE. One convention-collective page links https://basedoc.intra.ociane.matmut.fr/Lists/DocumentsOciane/... (a SharePoint path). Not publicly resolvable; ignore rather than retry.

    TRAP: NOT EVERYTHING UNDER /doc/CG/ IS AN INSURANCE CONTRACT. Four files in the conditions-générales tree are carried by non-insurers and were deliberately excluded: CGLLDPART.pdf and guide-restitution-arval.pdf are ARVAL Service Lease (352 256 424 RCS Paris) long-term-rental terms; CG-livret-matmut.pdf and /epargne-credit/pdf/conditions-tarifaires.pdf are Socram Banque (682 014 865 RCS Niort) savings-passbook terms and tariffs. All four return 200 and are real PDFs — they are simply not insurance.

    TRAP: THE /pro/pdf/ FOLDER IS MOSTLY NOT MATMUT DOCUMENTS. Of ~190 PDFs there, the large majority are the collective bargaining texts themselves (CCN-*-Accord-*.pdf, CCN-*-Avenant-*.pdf, CCN-*-Lettre-*.pdf) published by the branch social partners, not insurance documents. Only the CG / notice-information / garanties-sante files are contractual. Filter on the filename stem, not on the folder.

    TRAP: The 37 conditions_tarifaires entries are commercial offer terms (Bonus, Bonus Booster, Avantage Hiver, Usage Sérénité, Âge du véhicule, Bris de glaces franchise). They sit on the official conditions-générales page and each names its carrier, so they are recorded — but they are 1-2 page tariff riders, not product wordings. Filter on document_type if you only want wordings.

    TRAP: Two IPIDs for health live outside the main IPID folder, at /mutuelle/pdf/IPID-Elsie.pdf and /mutuelle/pdf/IPID-Sante-vous-bien.pdf. The santé product documents are split across four different directories (/mutuelle/pdf/, /mutuelle-sante-ociane/pdf/, /pro/pdf/ and /services-en-ligne/doc/CG/). There is no single santé folder.

    TRAP: DIC vs IPID: the savings and obsèques products publish a PRIIPs 'Document d'Information Clé' (dic-mve.pdf, dic-mvg.pdf, MPO.DIC.pdf) rather than an insurance IPID. They are typed `ipid` here because they play the same pre-contractual key-information role, but the regulation and the layout differ — flag if that matters downstream.

    TRAP: Matmut's own IPIDs do not use a 'Compagnie :' line; only the Ociane (santé) ones do. For the Code des assurances IPIDs the carrier is only in the legal block at the foot of page 2. All of them do carry a clean 'Produit :' line, so product names are reliable.

    TRAP: Some documents carry TWO reference codes with different dates: the document's own edition code and the underlying contract's or a partner's code. Example: notice-information-protection-juridique.pdf shows both 'PJ.260 - 02/25' (the Matmut Protection Juridique contract reference) and 'MOM.NOT.PJ - 10/25' (this notice's own edition). Prefer the code whose prefix matches the document type (NOT./NI./CG./IPID.), not the first one found. The ALISFA files instead date themselves on the cover ('CG Oblig-ALISFA-FM-12-2024', 'NI-FM-ALISFA-12-2024'); the repeated 'FCR571 10/27' in their tables is a form code, not a date.

  fetch_tier: plain          # Plain HTTP throughout, no blocking of any kind. curl and Python urllib
