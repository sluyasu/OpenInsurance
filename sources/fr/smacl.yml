insurer:
  slug: smacl
  name: "SMACL Assurances"
  website: "https://www.smacl.fr"
  segment: particuliers
  notes: |
    SMACL is a first-party carrier, but the brand covers TWO distinct licensed insurers and the split is by activity, not by vintage. It is NOT a transfer of portfolio. (1) SMACL ASSURANCES SA - 'Societe anonyme au capital de 138 801 048 euros, entreprise regie par le Code des assurances, RCS Niort n 833 817 224' (some documents print a later capital: 255 037 000 EUR, or 260 071 379,48 EUR). Its own statuts (smacl-assurances-sa-statuts.pdf, art. 7.3) state the shareholding: 'MAIF, titulaire de 9.979.300 actions representant 96,05% du capital social' and 'SMACL Assurances, titulaire de 410.000 actions representant 3,95%'. This is the MAIF-group entity. (2) SMACL ASSURANCES - 'Societe d'assurance mutuelle a cotisations fixes regie par le Code des assurances, RCS Niort n 301 309 605', the historic mutual, named in full inside two contracts as 'SMACL Assurances (Societe mutuelle d'assurance des collectivites locales)' (cg-juripacte-protection-juridique.pdf art. 1.3, cg-securite-elus.pdf). Its statuts (smacl-assurances-sam-statuts.pdf) say 'Par son adhesion au Groupe VYV depuis 2018, SMACL Assurances souhaite conforter le developpement de son modele economique' and devote Titre IV / art. 36 to its affiliation to the UMG Groupe VYV; the same statuts describe 'le rapprochement entre SMACL Assurances et MAIF pour constituer, au 1er janvier 2022, une societe d'assurance commune denommee SMACL Assurances SA'. So the mutual is the VYV-affiliated entity and the SA is the MAIF-controlled joint company it co-founded. HOW THE BOOK SPLITS. The SA carries the property/liability/motor/construction book: Aleassur (the collectivites master policy and all 14 of its conventions speciales), Convergence (associations), construction (dommages ouvrage, tous risques chantier), flottes entreprises, multirisques patrimoine, risques statutaires, and the whole particuliers range. The mutual carries the legal-protection and personal-protection book: Juripacte, Juris-Asso, Promut (protection fonctionnelle des agents et elus), Securite elus, Securite des fonctionnaires territoriaux, Protection juridique des associations, Securite des salaries et benevoles, Convergence RCDI (RC des dirigeants), and Assurance speciale accueil enfants. 82 of the 111 documents are SA-carried, 29 mutual-carried. NINE PRODUCTS ARE DUAL-PUBLISHED under both entities, with a '-sam' filename suffix marking the mutual version: loyers impayes, navigation de plaisance, the three conventions d'assistance (personnes, vehicules, patrimoine) and the four conventions d'information juridique. Diffed word by word, the two versions are the SAME CONTRACT: e.g. cg-loyers-impayes.pdf vs cg-loyers-impayes-sam.pdf differ in exactly three places - the internal reference code ('LOYERSIMPAYES_CG_SA_04(02_2023)' vs 'LOYERSIMPAYES_CG_04(02_2023)'), the deletion of 'SMACL Assurances SA, ci-apres denommee' from the Assureur definition, and the colophon ('Societe anonyme ... RCS Niort n 833 817 224' vs 'Societe d'assurance mutuelle a cotisations fixes ... RCS Niort n 301 309 605'). Same wording, two carriers. THE MUTUAL IS ACTIVE, NOT RUN-OFF: mutual-colophon documents carry reprint dates through 2024, 2025 and 2026-02 (fiche-territorialite-smacl.pdf), so this is a live dual-carrier structure. THIRD-PARTY CO-INSURERS on the statutory-risks range, for the death benefit only: cg-aleassur-prestations-statutaires.pdf (Modele 11, 04/2026) names 'MAIF VIE, pour la garantie deces - Societe anonyme au capital de 122 000 000 euros ... RCS Niort n 330 432 782' alongside SMACL Assurances SA, adding 'Ces deux entites sont denommees ci-apres l'assureur'; the older CNRACL documents (cs-aleassur-risques-statutaires-cnracl1_0.pdf and its IPID, 06/2023) instead name 'MUTEX ... RCS Nanterre n 529 219 040' for the same death benefit. The death-cover carrier therefore moved from MUTEX (a VYV-side life insurer) to MAIF VIE as the group realigned - visible only by comparing the two vintages. ASSISTANCE IS DELEGATED, NOT REINSURED AWAY: the conventions d'assistance keep 'Assureur: SMACL Assurances' but state 'Les prestations d'assistance sont mises en oeuvre par INTER MUTUELLES ASSISTANCE GIE (IMA GIE) ... immatricule au Registre du Commerce et des Societes de Niort sous le numero 433.240.991', trading as 'SMACL Assistance'. SMACL remains the risk carrier.

    NOT PUBLISHED: NO CONDITIONS PARTICULIERES. Nothing client-specific or specimen-level is published anywhere on smacl.fr; conditions particulieres are referenced constantly by the CG ('la personne morale souscriptrice mentionnee dans les conditions particulieres') but never published. NO TARIFFS OR PREMIUM RATES: the three baremes give contractual reimbursement ceilings, not prices. NO NOTICES D'INFORMATION as a separate family - the group products use conditions generales directly. IPID COVERAGE IS INCOMPLETE relative to the contract set: 28 IPIDs against 30 true conditions generales plus 29 conventions speciales, and the mismatch runs both ways. Products with conditions generales but no published IPID include Aleassur itself, Convergence itself, navigation de plaisance, loyers impayes, risques environnementaux, and the entire particuliers range (auto, habitation, accidents de la vie, conducteur, caravaning, rachat de franchise, RC vie privee, RC chasse, protection juridique particuliers) - the /offres/* pages that would host them are consumer pages that link no IPID. Conversely, an 'Assurance individuelle accident corporel vie scolaire' product is named inside three IPIDs' stale template layers but has no document of its own. NOTHING FOUND ON: cyber (only a non-contractual service leaflet naming CNPP as prevention partner), sante, assurance-vie, retraite, emprunteur, obseques, animaux, agricole, moto, edpm - SMACL does not appear to write these. Motorcycle cover for associations is intermediated: fiche-renseignements-assurance-mutuelle-des-motards-smacl.pdf is a questionnaire carrying 'Code Mutuelle des Motards : 11003', i.e. the risk sits with Mutuelle des Motards, but no contractual document for it is published on smacl.fr. NOT ESTABLISHED FROM THE DOCUMENTS: which entity writes which ACPR branch. The register shows 14 branches for each of the two entities, but the published library only evidences the product-line split described in carrier_note; no document states a branch allocation, and the ACPR register itself was not consulted here. Also not established: whether the nine dual-published products are sold concurrently by both entities or whether the mutual version serves only in-force policies - the documents are silent, and the reprint dates (mutual versions reprinted through 2026-02) are consistent with either reading.

    TRAP: TEXT EXTRACTION DROPS THE 'i' OF THE 'ti' LIGATURE. Across every PDF produced by SMACL's design chain, PyMuPDF returns 'Collectvites' for 'Collectivites', 'Associatons' for 'Associations', 'Partculiers' for 'Particuliers', 'cotsatons' for 'cotisations', 'Concepton'/'Directon' for 'Conception'/'Direction'. Any keyword search for words containing 'ti' will silently under-count: searching 'responsabilite penale' returns 2 hits, searching 'penal' returns 14 in cg-securite-elus.pdf alone. Search on stems that avoid 'ti', or de-ligature first.

    TRAP: THREE IPIDs CARRY LEFTOVER TEMPLATE LAYERS FROM OTHER PRODUCTS. document-information-dommages-ouvrage-collectivites.pdf, document-information-tous-risques-chantier-collectivites.pdf and document-information-risques-statutaires-collectivites-ircantec.pdf each contain FOUR 'Produit :' blocks in the extracted text - stale layers naming 'Assurance des accidents de la vie', 'Protection juridique' and 'Assurance individuelle accident corporel vie scolaire' - before the live one. Taking the first match gives the wrong product for all three. The live block is the last one, the one immediately followed by 'Ou suis-je couvert(e) ?'. Note this also leaks the existence of an 'Assurance individuelle accident corporel vie scolaire' product whose own IPID is not published anywhere on the site.

    TRAP: THE '-sam' FILENAME SUFFIX IS THE CARRIER, NOT A VARIANT. Nine documents exist in '-sam' and non-'-sam' pairs. These are not two editions and not two products: the contract wording is identical and only the colophon entity changes. Treating them as duplicates would erase the dual-carrier structure; treating them as separate products would double-count the range.

    TRAP: THE INTERNAL REFERENCE CODE ENCODES BOTH CARRIER AND EDITION. Every contractual PDF prints a code of the form PRODUCT_KIND[_SA]_MODEL(MM_YYYY), e.g. 'ALEASSUR_CG_10(02_2023)', 'LOYERSIMPAYES_CG_SA_04(02_2023)'. The '_SA_' token marks the SMACL Assurances SA version and its absence marks the mutual; the parenthesis is the model's edition month. This is the only in-document source of edition_date - 96 of 111 documents get their date this way. French IPIDs otherwise almost never print an edition date.

    TRAP: DO NOT USE THE COLOPHON'S PRINT DATE AS THE EDITION DATE. The last line reads e.g. '01/2024 - Conception : Direction developpement et communication SMACL Assurances'. That is the reprint date and it drifts from the model edition: cg-juripacte (Modele 11, edition 02/2023) was reprinted 05/2025. edition_date in this file is the model edition from the internal code; the reprint date is a separate signal, useful only for showing that the mutual is still active.

    TRAP: THE PROTECTION JURIDIQUE CONTRACTS NAME BOTH GROUPS IN ONE EXCLUSION. Juripacte, Juris-Asso, PJ associations and Securite elus all exclude 'les litiges opposant l'assure a SMACL Assurances SA ou a une entite affiliee a l'Union mutualiste de Groupe VYV'. A naive carrier-detection pass that counts occurrences of 'SMACL Assurances SA' will mis-assign these mutual-carried documents to the SA - cg-juripacte contains 11 occurrences of 'SMACL Assurances SA' and is nonetheless a mutual contract. Resolve the carrier from the 'Assureur'/'Compagnie' definition or the final colophon block, never from a raw count.

    TRAP: 'conditions-generales-achat-smacl-assurances.pdf' IS NOT AN INSURANCE DOCUMENT. Despite the filename it is SMACL's purchasing terms and conditions, i.e. SMACL as a buyer of goods and services. Excluded here.

    TRAP: THE IPIDs ARE NOT ON THE LIBRARY PAGES. The four 'contrats-d-assurance' pages carry only CG, CS, CA, conventions and baremes (92 anchors). All 28 IPIDs live on the /offres/* product pages instead. Stopping at the library pages loses every IPID; stopping at the product pages loses every set of conditions generales.

    TRAP: CONVENTIONS SPECIALES ARE MAPPED TO conditions_generales HERE. Aleassur (collectivites) and Convergence (associations) are modular policies: one set of CG plus a per-guarantee 'convention speciale'. A CS is standard-form general wording for one cover, not a client-specific schedule, so conditions_particulieres would be wrong. Of the 68 conditions_generales in this file, 30 are true conditions generales, 29 are conventions speciales and 9 are conventions d'assistance, counted the same way. Filter on the 'CS '/'CA ' prefix of product_name or the '_CS_'/'_CA_' token of internal_reference to separate them from the 30 true conditions generales.

    TRAP: SMACL PUBLISHES NO CONDITIONS PARTICULIERES AND NO TARIFFS, but it does publish three baremes of contractual caps (expert fees, protection juridique ceilings). Those are mapped to conditions_tarifaires as the closest slot; they are limit schedules, not premium rates.

    TRAP: ONE DOCUMENT NAMES ITSELF NOWHERE. bareme-plafonds-protection-juridique-collectivites.pdf opens straight into a table with no title and no PDF metadata title, so product_name falls back to the site anchor (name_source = 'site_label'). Every other document is named from its own text.

  fetch_tier: plain          # Plain HTTP throughout, Python urllib with a desktop browser User-Agent
