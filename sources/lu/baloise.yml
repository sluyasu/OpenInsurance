insurer:
  slug: baloise
  # pays: lu
  name: "Baloise Luxembourg"
  website: "https://www.baloise.lu"
  segment: both
  notes: |
    DEUX PORTEURS DE RISQUE SOUS UNE SEULE MARQUE, et le site est explicitement celui des deux :
    « www.baloise.lu est le site Internet des societes Baloise Assurances Luxembourg S.A., et
    Baloise Vie Luxembourg S.A. » (mentions legales). Registre du CAA, lu le 2026-08-03 :
      - BALOISE ASSURANCES LUXEMBOURG S.A. - non-vie, branches 1, 3, 6, 7, 8, 9, 10, 12, 13,
        16, 17, 18 - RCS Luxembourg B 68 065 - LEI 549300J4JNKWP52PIP34
      - BALOISE VIE Luxembourg S.A. - vie, branches I, II, III, VI, VII - RCS Luxembourg
        B 54 686 - LEI 549300NF39GNDIKK4T88
    Les deux ont leur siege 8, rue du Chateau d'Eau, L-3364 Leudelange.
    CONSEQUENCE POUR L EXTRACTION : ne jamais deduire le porteur de la marque. `carrier` se lit
    DANS le document ou reste null. Aucun `carrier` n a ete renseigne ici parce que cette passe
    est une DECOUVERTE : aucun PDF n a ete ouvert.

    NOT PUBLISHED - ZERO CONDITIONS GENERALES. Les 216 pages du site hors blog ont ete
    recuperees et fouillees hors ligne pour `conditions? g[ée]n[ée]rales?`,
    `allgemeine (versicherungs)?bedingungen`, `general (terms|conditions)`,
    `vertragsbedingungen`, `policy wording`. TROIS pages seulement contiennent une de ces
    chaines, et AUCUNE n est un lien vers un document :
      1. les mentions legales, pour les « Conditions generales d UTILISATION du site Internet »
      2. + 3. les pages assurance voyage FR et EN, dans une phrase editoriale invitant a lire
         les conditions generales de sa CARTE BANCAIRE.
    Il n existe aucun dossier `conditions-generales` dans le DAM, aucune rubrique documents,
    aucun sitemap. Meme resultat que Foyer (0 sur 800) et meme famille de resultat que lalux
    (4 sur 304, toutes en RC construction B2B).

    TRAP: UN SEUL FICHIER FRANCAIS SERT LES TROIS ARBRES DE LANGUE. Les pages allemandes et
    anglaises de la RC professionnelle, des degats materiels, du transport, de la construction,
    des flottes et du bateau pointent toutes vers le MEME PDF `...-FR-LU-...pdf`. Il n existe
    que 3 IPID allemands (Business, Drive, Home) et 2 anglais (Business, Drive) sur 34. Un
    pipeline qui deduit la langue de l arbre de la page se trompera 3 fois sur 4.

    TRAP: LES EDITIONS DIVERGENT ENTRE LANGUES DU MEME PRODUIT.
      - Home : le fichier FR est en edition 11-23, le fichier DE en edition 01-19.
      - Drive : les fichiers DE et EN sont en edition 02-19, le fichier FR n a AUCUNE date dans
        son nom (`ipid-drive-fr-lu.pdf`, 801 kB, Last-Modified 2025-07-08) et est manifestement
        plus recent.
    Regle 8 : ce ne sont pas des variantes paralleles, ce sont des editions differentes.

    TRAP: L IPID Drive EST l IPID moto. `/fr/particuliers/mon-assurance-luxembourg/moto-scooter.html`
    et `/fr/particuliers/mon-assurance-luxembourg/assurance-auto-electrique.html` publient tous
    deux `ipid-drive-fr-lu.pdf`, c est-a-dire l IPID auto. Aucun document deux-roues distinct
    n existe. C est la deuxieme confirmation independante (apres Foyer) du motif corrige dans
    `_country.yml` sous la branche `moto`.

    TRAP: `IPID-RC10-FR-LU-10-18.pdf` est intitule simplement « IPID RC » par l editeur. Le
    « 10 » du nom de fichier n est PAS elucide : il peut designer un code produit comme il peut
    designer la responsabilite decennale, ce qui basculerait le document de `rc-professionnelle`
    vers `construction`. Classe ici sur son contexte de publication (page RC professionnelle).
    A trancher a l extraction, pas avant.

    TRAP: l editeur ecrit « IPID RCSM SD » pour le fichier `IPID-RCMS-SD-...`. Les lettres sont
    transposees dans le libelle du site. Le nom de fichier fait foi.

    NON RETENUS ICI - 234 autres PDF de www.baloise.lu ont ete denombres et laisses de cote :
    70 fiches de fonds, 28 communiques de presse, 21 formulaires de declaration de sinistre,
    20 SFCR, 20 rapports annuels, 20 brochures/depliants, 17 KID/fiches de fonds internes,
    8 KID PRIIPs produit, 5 fiches d information financiere, 5 fiches fonds art. 10 SFDR,
    5 politiques d investissement responsable, 3 tableaux d avantage fiscal, 3 guides ESG,
    3 checklists de blog, 2 brochures corporate, 1 convention droit a l oubli, 1 politique de
    reclamation, 1 notice RGPD, 1 divers. Meme decoupe que `lalux.yml`, qui n ingere que les
    IPID et les conditions generales. Detail dans `_meta/discovery/lu/baloise.md`.

    BLOQUE - 896 documents sur `kid.baloise.lu`, respectes et non recuperes. Ce sont les KID
    PRIIPs et les informations SFDR art. 6/8/9/10 des 364 fonds sous-jacents de deux contrats
    en unites de compte. `https://kid.baloise.lu/robots.txt` dit `Disallow: international/` et
    les 896 URL sont toutes sous `/international/`. Aucune n a ete demandee.

    BLOQUE - `https://www.mybaloise.lu/robots.txt` dit `User-agent: *` / `Disallow: /`. Le
    portail client est entierement ferme et rien n y a ete demande. A noter pour la comparaison
    avec la Belgique, ou `sources/be/baloise.yml` liste au contraire une page publique
    `mybaloise.baloise.be/fr/documenten/all-ipid-eid`.

  fetch_tier: plain          # www.baloise.lu repond 200 a curl ET a urllib, A CONDITION
                             # d envoyer un en-tete `Accept`. Sans `Accept`, le serveur repond
                             # 406 Not Acceptable. Corrige `_meta/lu-market-census.md`, qui
                             # classait cet hote « curl-hostile » sur la base de l inverse.
                             # robots.txt (2026-08-03) : `User-agent: *` / `Disallow:` - vide,
                             # donc rien d interdit. Les 268 PDF de l hote ont repondu 200 a
                             # une requete HEAD, sans exception.

