insurer:
  slug: lalux
  # pays: lu
  name: "lalux"
  website: ""
  segment: particuliers
  notes: |
    NOT A CARRIER under its own name. 

    NOT PUBLISHED: {'question': 'Does lalux publish full conditions generales, or only the IDD information document?', 'answer': 'ALMOST ONLY THE IDD DOCUMENT. Exactly 4 of 304 documents are real conditions generales, and all 4 belong to the APROBAT construction/professional range: RC Professionnelle Architectes et Ingenieurs-Conseils (FR 19p + DE 19p, ed. 01-05-2025) and RC Decennale et Biennale (FR 18p + DE 17p, ed. 10-07-2025). For the ENTIRE retail book - auto, habitation, RC familiale, protection juridique, accidents, voyage, and every life product - NO conditions generales are published anywhere on lalux.lu.', 'evidence': 'The string "conditions generales" occurs in 47 bodies, but in 43 of them it is the IPID boilerplate pointing AWAY from the site: "pour l\'integralite des droits et obligations de l\'entreprise d\'assurances et de l\'assure, veuillez consulter les conditions generales et/ou particulieres relatives au produit d\'assurance choisi". The CG it names are not on the site. Checked every document >= 8 pages: all are annual reports, SFCR, or tax/newcomer guides, no retail CG hiding among them. The documents hub has no CG section in any of its 5 language trees, and the 435-URL sitemap has zero conditions/bedingungen pages.', 'what_lalux_calls_the_idd_document': {'site_section_slug': 'ipid (identical slug in all 5 UI languages: /fr/.../ipid, /de/.../ipid, /en/.../ipid, /lu/.../ipid, /pt/.../ipid)', 'fr': "Document d'information sur le produit d'assurance", 'de': 'Informationsblatt zum Versicherungsprodukt', 'en': 'Insurance Product Information Document', 'note': 'lalux uses the acronym IPID as its own filing term, in the URL path and in filenames. It does NOT use a local Luxembourgish term. The FR wording is the EU IPID standard wording, not a lalux coinage.'}, 'comparison_to_france': 'Same dividing line as the French market, and lalux falls on the same side as most French insurers: summary only. The difference is WHERE the exception sits - in France the exceptions were usually retail lines from mutual insurers; here the only published CG are B2B construction liability, i.e. the lines sold through brokers to professionals who negotiate on wording.'}
    NOT PUBLISHED: {'question': 'Is anything aimed at frontaliers (225 840 cross-border workers)?', 'answer': 'YES, and it is a deliberate, named, multilingual campaign - but it is confined to the pension/life side, exactly where the brief predicted.', 'evidence': ['easyLIFE Pension brochure exists in 3 languages and addresses them in the headline: FR "FRONTALIER ?", DE "GRENZGAENGER?", EN "Did you know that as a cross-border worker, you can take...". This is the Luxembourg tax-deduction product (art. 111bis LIR) which a non-resident can still claim by opting into Luxembourg taxation.', 'A dedicated expat brochure exists in 3 languages: ASSURANCES_POUR_EXPATS-FR / VERSICHERUNGEN_FUR_EXPATS-DE / INSURANCES_FOR_EXPATS-EN.', 'The tax-advantage brochure exists in 3 languages: GAINS_IMPOT-FR / STEUERVORTEILE-DE / TAX_GAINS-EN.', 'Newcomer guides, 84 pages, FR and EN: guide-nouveaux_arrivants_au_luxembourg-fr-2027 / guide-newcomers_in_luxembourg-en-2027, plus GUIDE_DES_IMPOTS_2026 (116p).', 'The affiliate-exit form names the frontalier countries explicitly: "si vous residez en dehors du Luxembourg et en dehors d\'un pays frontalier (France, Belgique, ...)".', 'The easyLIFE Epargne and easyLIFE Mixte fiches carry a non-resident carve-out: "Les non-residents doivent s\'en referer [a la legislation de leur pays]".'], 'the_asymmetry': 'Nothing on the motor or home side is aimed at frontaliers - consistent with the fact that a frontalier garages the car and lives at home in FR/BE/DE, so those contracts are written by a foreign insurer. lalux targets frontaliers precisely and only where the Luxembourgish situation follows the person rather than the address: pension, life, tax.'}
    NOT PUBLISHED: {'question': 'Any document in letzebuergesch?', 'answer': 'NO. Confirmed, and confirmed the hard way rather than by assuming.', 'evidence': 'The /lu/ UI tree is fully built and returns 200 on the hub and all 11 sub-sections (/lu/infoen-tools/dokumenter/...). It lists 90 PDFs. Every one of those 90 is a document already served under another language tree - ZERO are listed only under /lu/ - and their bodies are 33 fr, 27 en, 25 de, 5 pt, with 0 lb. So lalux has a letzebuergesch INTERFACE and no letzebuergesch DOCUMENT. This corroborates the market-wide finding rather than breaking it.', 'method_note': 'Language was measured on the extracted body text of every PDF, not on the URL suffix.'}

    TRAP: _ALL suffix does NOT mean "all languages" - it means allemand — Fiche_info_fin_022026_-_easyLIFE_Epargne_-_ALL.pdf, _easyLIFE_Pension_-_formule_Performance_-_ALL.pdf and _formule_Securite_-_ALL.pdf are pure German (de score 102-118, fr 4-5). In each of those three product families there is an _EN and an _FR but no _DE - the _ALL file IS the German one, labelled with the French abbreviation for "allemand". A pipeline reading _ALL as multilingual, or failing to find _DE and recording German as absent, gets both wrong.

    TRAP: Four claim forms are byte-identical across a _FR and a _DE filename — sha 57950675df22, e45ddf11087e, bc357765ab87, 61753cf1499a. Each is ONE bilingual FR/DE form published twice. Kept once, the twin listed in dropped_duplicates.

    TRAP: Filename language suffix contradicts body language on 4 files — The 3 Declaration-*-FR.pdf claim forms read as German-dominant and Schadenmeldung-Stromschaeden-DE.pdf reads as French-dominant, because they are bilingual forms whose column order differs. Body-text measurement, not the suffix, is what settles lang.

    TRAP: Two IPID filenames carry an opaque abbreviation and NO language marker — ipid_assurance-td.pdf is French and is the Solde Restant Du / mortgage product (TD = temporaire decroissante). ipid_assurance-dec.pdf is French and is lalux-Security, assurance deces a capital constant (DEC = deces). Neither says fr. Both are LALUX Assurances-Vie. Also note the solde-restant-du line publishes only FR (ipid_assurance-td) and EN (ipid_assurance-solde-restant-du_en_version-112018, edition 11/2018) - no German at all, and the EN one is 8 years old.

    TRAP: KID duplicates across two naming generations — The capital-differe KIDs exist twice under two schemes (KID_Assurance_de_capital_differe_..._FR_prime_unique.pdf vs kid_Capital_Differe_fin_CapitalDiffereAR_fr_102024.pdf) and are byte-identical in 4 cases. Deduped by sha256; the remaining ones differ and were kept.

    TRAP: The /lu/ and /pt/ hubs return 200 and are NOT evidence of documents in those languages — /lu/ lists 90 files, all of them FR/DE/EN/PT. /pt/ returns 200 on all 11 sections but yields only 5 real PT files. Status codes on the hub say nothing about document language.

    TRAP: One transient network failure masqueraded as a missing document — IPID_BUSINESS_TRAVEL_fr.pdf errored on first fetch while _de and _en returned 200, which reads exactly like a missing French variant. Forced refetch returned 200, 347602 bytes. Re-verify before recording any language as absent.

    TRAP: One dead link and one text-free PDF — 404: /fileadmin/mediatheque/documents/Divers/RCP/20200220-RCP-fiche-contact-vierge.pdf (still linked from the divers shelf). Text-free (3 chars extracted, likely a scan): /fileadmin/mediatheque/documents/Divers/convention-droit-a-l-oubli-29102019.pdf - the droit a l'oubli convention, which would otherwise be an interesting health-underwriting document.

    214 document(s) enumerated but deliberately absent below; see the
    discovery file for the list and the reason.

